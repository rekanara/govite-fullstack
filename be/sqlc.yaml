version: "2"
sql:
  - engine: postgresql
    schema: internal/platform/postgres/migrations
    queries: internal/platform/postgres/queries
    gen:
      go:
        package: store
        out: internal/platform/postgres/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
