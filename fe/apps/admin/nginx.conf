server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # nginx drops inherited add_header once a location sets its own, so every
    # location that adds a header re-includes the security set.
    include /etc/nginx/snippets/security-headers.conf;

    # Same origin as the SPA: no CORS, refresh cookie (path /api/v1/auth) works.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html must revalidate so a deploy is picked up immediately.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
