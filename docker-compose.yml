# Local infra only. API (be/) and web (fe/) run on the host.
# Host ports are offset to avoid clashing with other projects' containers.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    ports: ["5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  postgres_test:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
    ports: ["5436:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6380:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9100:9000", "9101:9001"]
    volumes: ["minio_data:/data"]

volumes:
  postgres_data:
  minio_data:
