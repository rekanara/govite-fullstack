name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  be:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5436:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: be } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: be/go.mod, cache-dependency-path: be/go.sum }
      - name: Start MinIO
        # Service containers can't pass `server /data`, so run it directly.
        run: |
          docker run -d --name minio -p 9100:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z server /data
          for i in $(seq 30); do curl -sf localhost:9100/minio/health/live && exit 0; sleep 1; done; exit 1
      - run: make lint
      # Fails only on vulnerabilities our code actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: make test-e2e
        env: { TEST_MINIO_ENDPOINT: "localhost:9100" }
      - run: make build

  fe:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fe } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: fe/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: fe/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
